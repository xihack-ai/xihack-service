[project]
name = "xihack"
version = "0.1.0"
description = "xihack 后端服务(FastAPI 空骨架)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2,<4",
    "firecrawl-anydoc==0.2.4",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "offline_llm: 保持真实离线 LLM 环境(默认测试用显式假模型替身)",
]

[tool.setuptools]
packages = ["app", "app.workflow", "hirespec_loop"]

[tool.setuptools.package-data]
app = ["schema.sql"]
