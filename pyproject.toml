[project]
name = "xihack"
version = "0.1.0"
description = "探索式知识库问答服务(FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "hirespec_loop"]

[tool.setuptools.package-data]
hirespec_loop = ["data/*.json"]
