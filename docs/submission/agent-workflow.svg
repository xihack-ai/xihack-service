<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1590" viewBox="0 0 1600 1590"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64748b"/></marker></defs><rect width="1600" height="1590" fill="#f5f7fc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="72" font-size="36" fill="#172554">HireSpec Loop · Agent 工作流</text><text x="64" y="115" font-size="19" fill="#475569">明确区分待澄清、被拦截、无变更和待审批；拒绝候选人不会自动修改正式 Spec</text><text x="64" y="172" font-size="26" fill="#4338ca">A · 需求与候选人评估</text><text x="830" y="172" font-size="26" fill="#4338ca">B · 反馈校准与审批</text><rect x="64" y="220" width="620" height="150" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="257" font-size="25" fill="#6366f1">需求问答 → 标准草稿</text><text x="86" y="293" font-size="19" fill="#334155">/requirements/clarify · 经理逐题回答</text><text x="86" y="322" font-size="19" fill="#334155">clarify → generate_spec · 保留名单与类型</text><rect x="64" y="425" width="620" height="150" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="462" font-size="25" fill="#6366f1">人工确认标准</text><text x="86" y="498" font-size="19" fill="#334155">spec_confirmation · 可暂停</text><text x="86" y="527" font-size="19" fill="#334155">正式标准发布；待确认项保留</text><rect x="64" y="630" width="620" height="150" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="667" font-size="25" fill="#6366f1">上传简历 / 发起评估</text><text x="86" y="703" font-size="19" fill="#334155">FastAPI 解析文件，接收文本</text><text x="86" y="732" font-size="19" fill="#334155">extract_evidence · 逐条提取</text><rect x="64" y="835" width="620" height="150" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="872" font-size="25" fill="#6366f1">校验原文引用</text><text x="86" y="908" font-size="19" fill="#334155">validate_evidence · 精确匹配</text><text x="86" y="937" font-size="19" fill="#334155">无效引用降级；缺失≠不满足</text><rect x="64" y="1040" width="620" height="150" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="1077" font-size="25" fill="#6366f1">确定性分档与证据展示</text><text x="86" y="1113" font-size="19" fill="#334155">evaluate · 推荐 / 待核实</text><text x="86" y="1142" font-size="19" fill="#334155">不推荐 / 否决；稳定排序</text><polyline points="374,370 374,425" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="374,575 374,630" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="374,780 374,835" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="374,985 374,1040" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="830" y="220" width="700" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="852" y="257" font-size="25" fill="#6366f1">经理提交反馈</text><text x="852" y="293" font-size="19" fill="#334155">interpret_feedback → bias_risk_check</text><text x="852" y="322" font-size="19" fill="#334155">岗位相关性与敏感筛选条件审核</text><rect x="830" y="420" width="330" height="145" rx="16" fill="white" stroke="#b45309" stroke-width="2"/><text x="852" y="457" font-size="25" fill="#b45309">BLOCKED · 拦截</text><text x="852" y="493" font-size="19" fill="#334155">说明理由，编辑原反馈</text><text x="852" y="522" font-size="19" fill="#334155">不发布标准 / 不允许批准</text><rect x="1200" y="420" width="330" height="145" rx="16" fill="white" stroke="#b45309" stroke-width="2"/><text x="1222" y="457" font-size="25" fill="#b45309">NEEDS_CLARIFICATION</text><text x="1222" y="493" font-size="19" fill="#334155">向用人经理逐题追问</text><text x="1222" y="522" font-size="19" fill="#334155">HR 可代填后重新审核</text><polyline points="1040,365 1040,420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1365,365 1365,420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1530,500 1570,500 1570,290 1530,290" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="830" y="630" width="700" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="852" y="667" font-size="25" fill="#6366f1">SAFE → propose_change</text><text x="852" y="703" font-size="19" fill="#334155">最小必要变更；生成 diff 与受影响条款</text><text x="852" y="732" font-size="19" fill="#334155">NO_CHANGE：结束，正式标准不变</text><polyline points="1180,365 1180,610 1180,630" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="830" y="835" width="700" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="852" y="872" font-size="25" fill="#6366f1">human_approval · 人工审批</text><text x="852" y="908" font-size="19" fill="#334155">Accept：重新校验后发布；Edit：只保存草稿</text><text x="852" y="937" font-size="19" fill="#334155">Reject：结束，正式标准不变；过期提议拒绝</text><polyline points="1180,775 1180,835" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="830" y="1040" width="700" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="852" y="1077" font-size="25" fill="#6366f1">发布 Spec v2 · selective_reeval</text><text x="852" y="1113" font-size="19" fill="#334155">语义改变 / 新增：重评受影响条款</text><text x="852" y="1142" font-size="19" fill="#334155">仅调整排序类别：复用证据；删除：移除排序影响</text><polyline points="1180,980 1180,1040" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="830" y="1245" width="700" height="145" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/><text x="852" y="1282" font-size="25" fill="#0f766e">完成新版评估 → 整体切换排名</text><text x="852" y="1318" font-size="19" fill="#334155">保留历史版本、审批记录和审计轨迹</text><text x="852" y="1347" font-size="19" fill="#334155">任务失败保留上一版完整结果，不混用版本</text><polyline points="1180,1185 1180,1245" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="684,1115 755,1115 755,200 1180,200 1180,220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="1245" width="620" height="145" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/><text x="86" y="1282" font-size="25" fill="#0f766e">评估对象与可信边界</text><text x="86" y="1318" font-size="19" fill="#334155">候选人 × 条款：结论 + 原文证据 + 疑点</text><text x="86" y="1347" font-size="19" fill="#334155">原文存在不等于推理正确，仍需人工抽查</text><text x="86" y="1376" font-size="19" fill="#334155">模型失败作为任务错误，不用模拟结果替代</text><text x="64" y="1490" font-size="19" fill="#334155">反馈问答留在同一会话；经理回答后重新审核。候选人上传和问答入口由 FastAPI 调用相应工作流路径。</text><text x="64" y="1530" font-size="19" fill="#334155">此图为实现概览；图中的人工决策和接口入口不全部对应独立 LangGraph 节点。</text></g></svg>