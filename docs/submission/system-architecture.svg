<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64748b"/></marker></defs><rect width="1600" height="1030" fill="#f5f7fc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="72" font-size="36" fill="#172554">HireSpec Loop · 系统架构</text><text x="64" y="115" font-size="19" fill="#475569">需求校准 → 证据评估 → 反馈提议 → 人工审批 → 局部重评；依据当前实现绘制</text><rect x="64" y="170" width="400" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="207" font-size="25" fill="#6366f1">浏览器 · Next.js 工作台</text><text x="86" y="243" font-size="19" fill="#334155">HR / 用人经理 / 猎头 / HRD</text><text x="86" y="272" font-size="19" fill="#334155">需求、PDF 上传、证据、审批</text><rect x="600" y="170" width="390" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="622" y="207" font-size="25" fill="#6366f1">Nginx · 团队演示入口</text><text x="622" y="243" font-size="19" fill="#334155">HTTP 网站 + 演示账号认证</text><text x="622" y="272" font-size="19" fill="#334155">静态前端；/api/ 转发后端</text><rect x="1120" y="170" width="410" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="1142" y="207" font-size="25" fill="#6366f1">FastAPI · 业务接口</text><text x="1142" y="243" font-size="19" fill="#334155">输入校验、任务与版本管理</text><text x="1142" y="272" font-size="19" fill="#334155">后端 127.0.0.1:8010</text><polyline points="464,240 600,240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="990,240 1120,240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="440" width="400" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="86" y="477" font-size="25" fill="#6366f1">AnyDoc · 本地文件解析</text><text x="86" y="513" font-size="19" fill="#334155">PDF / DOC / DOCX / RTF → 文本</text><text x="86" y="542" font-size="19" fill="#334155">扫描件需另接 OCR，不虚构内容</text><rect x="600" y="440" width="390" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="622" y="477" font-size="25" fill="#6366f1">LangGraph · 校准 Agent</text><text x="622" y="513" font-size="19" fill="#334155">澄清、证据提取、审核与提议</text><text x="622" y="542" font-size="19" fill="#334155">interrupt 等待人工确认 / 审批</text><rect x="1120" y="440" width="410" height="145" rx="16" fill="white" stroke="#6366f1" stroke-width="2"/><text x="1142" y="477" font-size="25" fill="#6366f1">DeepSeek 官方 API</text><text x="1142" y="513" font-size="19" fill="#334155">接入个人 DeepSeek API Key</text><text x="1142" y="542" font-size="19" fill="#334155">HTTPS + JSON；模型异常报错</text><polyline points="1325,315 1325,365 265,365 265,440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1200,315 1200,390 795,390 795,440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="990,510 1120,510" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="710" width="930" height="185" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/><text x="622" y="747" font-size="25" fill="#0f766e">PostgreSQL 17 · Docker · xks</text><text x="622" y="783" font-size="19" fill="#334155">业务：jobs / spec_versions / candidates / evaluations / feedback</text><text x="622" y="812" font-size="19" fill="#334155">change_proposals / candidate_labels / audit_events</text><text x="622" y="841" font-size="19" fill="#334155">工作流：PostgresSaver checkpoint；数据库仅监听本机 5432</text><polyline points="795,585 795,710" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1480,315 1560,315 1560,680 1410,680 1410,710" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="710" width="400" height="185" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/><text x="86" y="747" font-size="25" fill="#0f766e">程序负责可信边界</text><text x="86" y="783" font-size="19" fill="#334155">逐字引用验证 + 原文位置</text><text x="86" y="812" font-size="19" fill="#334155">确定性分档，无模型总分</text><text x="86" y="841" font-size="19" fill="#334155">变更范围决定重评范围</text><text x="64" y="970" font-size="19" fill="#334155">密钥仅配置在后端运行环境；未接入赛事赞助商 API。当前为团队演示，完整组织权限与 HTTPS 尚待补齐。</text></g></svg>